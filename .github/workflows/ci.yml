# GitHub Actions workflow — runs automatically on GitHub's computers.
# "CI" = Continuous Integration: every time code is pushed, check that it still works.
# See the results in the "Actions" tab of the repo on github.com.

name: CI

# WHEN to run: on every push to main, and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow may only read the code.
permissions:
  contents: read

jobs:
  python:
    name: Lint & test Python
    runs-on: ubuntu-latest          # a fresh Linux virtual machine from GitHub
    steps:
      - uses: actions/checkout@v4   # download the repo's code onto the VM
      - uses: astral-sh/setup-uv@v5 # install uv
      - run: uv sync                # install Python + dependencies
      - run: uv run ruff check .    # lint
      - run: uv run ruff format --check .
      - run: uv run pytest          # run tests

  bicep:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Azure CLI is pre-installed on GitHub's VMs; `bicep build` checks syntax
      # without needing any Azure login.
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
